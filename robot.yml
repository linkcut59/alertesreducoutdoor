name: Robot prix

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:          # bouton « Lancer le robot maintenant »

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python robot/check.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Enregistrer les nouveaux prix
        run: |
          git config user.name "robot-prix"
          git config user.email "robot-prix@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Relevé des prix $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
