<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bons plans outdoor</title>
<style>
  :root {
    --bg: #f1f5f4;
    --card: #ffffff;
    --ink: #14231c;
    --muted: #5b6b64;
    --line: #d5dedb;
    --accent: #0f6cbd;
    --deal: #ffd23f;
    --deal-ink: #3a2e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1814;
      --card: #17241e;
      --ink: #e8f0ec;
      --muted: #94a69d;
      --line: #28382f;
      --accent: #5aa9ec;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.45;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { font-size: 1.9rem; line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; max-width: 52ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  input[type="search"], select {
    font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 0; }
  a.telegram {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600;
  }
  a.telegram:focus-visible, a.deal:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  #status { color: var(--muted); font-size: 0.9rem; margin: 4px 0 10px; }
  ul { list-style: none; margin: 0; padding: 0 0 40px; display: grid; gap: 10px; }
  a.deal {
    display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; color: inherit; text-decoration: none;
  }
  .thumb {
    width: 76px; height: 76px; border-radius: 6px; background: var(--line);
    object-fit: cover; display: block;
  }
  .title { font-weight: 600; margin: 0 0 2px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 0; }
  .price { text-align: right; white-space: nowrap; }
  .now { font-weight: 700; font-size: 1.1rem; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 0.85rem; }
  .badge {
    display: inline-block; background: var(--deal); color: var(--deal-ink);
    font-weight: 700; font-size: 0.8rem; padding: 2px 7px; border-radius: 5px; margin-bottom: 4px;
  }
  @media (max-width: 440px) {
    a.deal { grid-template-columns: 60px 1fr; }
    .thumb { width: 60px; height: 60px; }
    .price { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <h1>Bons plans outdoor</h1>
  <p class="sub">Les grosses baisses de prix repérées chez les grandes enseignes outdoor, mises à jour automatiquement.</p>
  <div class="tools">
    <input id="q" type="search" placeholder="Rechercher une marque ou un produit" aria-label="Rechercher">
    <select id="min" aria-label="Remise minimale">
      <option value="0">Toutes les remises</option>
      <option value="20">20 % et plus</option>
      <option value="30">30 % et plus</option>
      <option value="50">50 % et plus</option>
    </select>
    <a id="tg" class="telegram" href="https://t.me/alertesreducoutdoor" hidden>Recevoir les alertes sur Telegram</a>
  </div>
  <div id="status" role="status">Chargement des alertes…</div>
</header>
<main>
  <ul id="list"></ul>
</main>

<script>
// ---- À MODIFIER ----
// Lien d'invitation de ton canal Telegram (laisse vide pour masquer le bouton)
var TELEGRAM_URL = "";
// Fichier de données écrit par ton robot, à la racine du dépôt
var DATA_FILE = "alerts.json";
// --------------------

var allDeals = [];
var listEl = document.getElementById("list");
var statusEl = document.getElementById("status");

if (TELEGRAM_URL) {
  var tg = document.getElementById("tg");
  tg.href = TELEGRAM_URL;
  tg.hidden = false;
}

function pick(o, keys) {
  for (var i = 0; i < keys.length; i++) {
    if (o[keys[i]] !== undefined && o[keys[i]] !== null && o[keys[i]] !== "") return o[keys[i]];
  }
  return null;
}

function num(v) {
  if (v === null) return null;
  var n = parseFloat(String(v).replace(",", ".").replace(/[^\d.]/g, ""));
  return isNaN(n) ? null : n;
}

function euro(n) {
  return n === null ? "" : n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
}

function normalize(raw) {
  var price = num(pick(raw, ["price", "prix", "new_price", "prix_actuel", "current_price"]));
  var old = num(pick(raw, ["old_price", "ancien_prix", "original_price", "prix_initial", "prix_barre"]));
  var pct = num(pick(raw, ["discount", "remise", "reduction", "discount_pct", "pourcentage"]));
  if (pct === null && price !== null && old !== null && old > 0) {
    pct = Math.round((1 - price / old) * 100);
  }
  return {
    title: pick(raw, ["title", "titre", "name", "nom", "product"]) || "Produit",
    shop: pick(raw, ["shop", "store", "boutique", "site", "merchant"]) || "",
    url: pick(raw, ["url", "lien", "link"]) || "#",
    image: pick(raw, ["image", "img", "photo", "thumbnail"]),
    date: pick(raw, ["date", "created_at", "timestamp", "found_at"]),
    price: price, old: old, pct: pct
  };
}

function render() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var min = parseInt(document.getElementById("min").value, 10);
  var shown = allDeals.filter(function (d) {
    var text = (d.title + " " + d.shop).toLowerCase();
    return (!q || text.indexOf(q) !== -1) && (d.pct === null ? min === 0 : d.pct >= min);
  });
  listEl.innerHTML = "";
  shown.forEach(function (d) {
    var a = document.createElement("a");
    a.className = "deal";
    a.href = d.url;
    a.target = "_blank";
    a.rel = "noopener";

    var img = document.createElement("img");
    img.className = "thumb";
    img.alt = "";
    img.loading = "lazy";
    if (d.image) img.src = d.image;

    var mid = document.createElement("div");
    var t = document.createElement("p");
    t.className = "title";
    t.textContent = d.title;
    var m = document.createElement("p");
    m.className = "meta";
    var parts = [];
    if (d.shop) parts.push(d.shop);
    if (d.date) {
      var dt = new Date(d.date);
      if (!isNaN(dt)) parts.push(dt.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }));
    }
    m.textContent = parts.join(", ");
    mid.appendChild(t);
    mid.appendChild(m);

    var right = document.createElement("div");
    right.className = "price";
    if (d.pct !== null) {
      var b = document.createElement("div");
      b.className = "badge";
      b.textContent = "-" + d.pct + " %";
      right.appendChild(b);
    }
    var now = document.createElement("div");
    now.className = "now";
    now.textContent = euro(d.price);
    right.appendChild(now);
    if (d.old !== null) {
      var o = document.createElement("div");
      o.className = "old";
      o.textContent = euro(d.old);
      right.appendChild(o);
    }

    a.appendChild(img);
    a.appendChild(mid);
    a.appendChild(right);
    var li = document.createElement("li");
    li.appendChild(a);
    listEl.appendChild(li);
  });
  statusEl.textContent = allDeals.length === 0
    ? "Aucune alerte pour le moment. Reviens bientôt."
    : shown.length + " alerte" + (shown.length > 1 ? "s" : "") + " affichée" + (shown.length > 1 ? "s" : "");
}

fetch(DATA_FILE + "?t=" + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (json) {
    var arr = Array.isArray(json) ? json : (json.alerts || json.deals || json.items || []);
    allDeals = arr.map(normalize);
    // plus récentes d'abord si une date existe
    allDeals.sort(function (a, b) {
      return (new Date(b.date || 0)) - (new Date(a.date || 0));
    });
    render();
  })
  .catch(function () {
    statusEl.textContent = "Impossible de charger " + DATA_FILE + ". Vérifie qu'il existe à la racine du dépôt.";
  });

document.getElementById("q").addEventListener("input", render);
document.getElementById("min").addEventListener("change", render);
</script>
</body>
</html>
